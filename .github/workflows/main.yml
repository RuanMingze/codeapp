name: Build CodeApp Unsigned IPA
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macOS-26
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Generate placeholder Secrets.swift
        run: |
          mkdir -p CodeApp/Constants
          echo 'let JUDGE0_ENDPOINT = ""' > CodeApp/Constants/Secrets.swift
          echo 'let JUDGE0_KEY = ""' >> CodeApp/Constants/Secrets.swift

      - name: Download prebuilt frameworks
        run: |
          chmod +x downloadFrameworks.sh
          ./downloadFrameworks.sh

      - name: Verify schemes
        run: xcodebuild -list -project Code.xcodeproj

      - name: Build iOS (unsigned)
        run: |
          xcodebuild build \
            -project Code.xcodeproj \
            -scheme "Code App" \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package to IPA
        run: |
          APP_BUNDLE=$(find ~/Library/Developer/Xcode/DerivedData -path "*Release-iphoneos*" -name "*.app" | head -n1)
          echo "Found: $APP_BUNDLE"
          lipo -info "$APP_BUNDLE"/Code
          mkdir -p Payload
          cp -R "$APP_BUNDLE" Payload/
          zip -qr CodeApp.ipa Payload
          mkdir -p Output
          mv CodeApp.ipa Output/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-unsigned-ipa
          path: Output/*.ipa
