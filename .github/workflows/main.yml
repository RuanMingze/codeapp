name: Build Unsigned IPA
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macOS-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Select Xcode 26.2
        run: sudo xcode-select -s /Applications/Xcode_26.2.app

      - name: Clean SPM cache
        run: |
          rm -rf ~/Library/Developer/Xcode/DerivedData/*
          rm -rf ~/Library/Caches/org.swift.swiftpm
          rm -rf ~/Library/org.swift.swiftpm

      - name: Create placeholder Secrets.swift
        run: |
          mkdir -p CodeApp/Constants
          cat > CodeApp/Constants/Secrets.swift <<'EOF'
          let JUDGE0_ENDPOINT = ""
          let JUDGE0_KEY = ""
          EOF

      - name: Download prebuilt frameworks
        run: |
          chmod +x downloadFrameworks.sh
          ./downloadFrameworks.sh

      - name: Resolve SPM dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Code.xcodeproj \
            -scheme "Code App"

      - name: Verify resolved packages
        run: |
          find ~/Library/Developer/Xcode/DerivedData -path "*SourcePackages/checkouts" -maxdepth 5 -type d | head -20

      - name: Build iOS (unsigned)
        run: |
          xcodebuild build \
            -project Code.xcodeproj \
            -scheme "Code App" \
            -destination "generic/platform=iOS" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package to IPA
        run: |
          APP_BUNDLE=$(find ~/Library/Developer/Xcode/DerivedData -path "*Release-iphoneos*" -name "*.app" | head -n1)
          echo "Found: $APP_BUNDLE"
          lipo -info "$APP_BUNDLE"/Code
          mkdir -p Payload
          cp -R "$APP_BUNDLE" Payload/
          zip -qr CodeApp.ipa Payload
          mkdir -p Output
          mv CodeApp.ipa Output/

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-unsigned-ipa
          path: Output/*.ipa
