name: Build CodeApp NoPlist IPA
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download prebuilt frameworks
        run: |
          chmod +x downloadFrameworks.sh
          ./downloadFrameworks.sh

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: List all targets (debug)
        run: xcodebuild -list -project Code.xcodeproj

      - name: Build iOS target CodeUI (generic iOS device)
        run: |
          xcodebuild build \
            -project Code.xcodeproj \
            -target CodeUI \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package to IPA
        run: |
          APP_BUNDLE=$(find ./DerivedData -path "*Release-iphoneos*" -name "*.app" | head -n1)
          echo "App path: $APP_BUNDLE"
          lipo -info "$APP_BUNDLE"/CodeUI
          mkdir -p Payload
          cp -R "$APP_BUNDLE" Payload/
          zip -qr CodeApp.ipa Payload
          mkdir -p Output
          mv CodeApp.ipa Output/

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: CodeApp-unsigned-ipa
          path: Output/*.ipa
